[package]
name = "rhusky"
description = "Git hooks manager for Rust projects - like Husky, but for Rust"
version = "0.0.6"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["git", "hooks", "husky", "pre-commit", "commit-msg"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
authors = ["Jacobus Geluk <jacobus.geluk@dataroad.com>"]
repository = "https://github.com/legra-ai/rhusky"
documentation = "https://docs.rs/rhusky"
homepage = "https://github.com/legra-ai/rhusky"
rust-version = "1.85.0"
publish = true

include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lib]
name = "rhusky"
path = "src/lib.rs"

[dependencies]
async-fs-io = "0.1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
serial_test = "3.5"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
